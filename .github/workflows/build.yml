name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Ветка, тег или коммит для сборки'
        type: string
        default: ''
      full_matrix:
        description: 'Собрать все платформы при вызове из другого workflow'
        type: boolean
        default: true
      require_signed_updates:
        description: 'Требовать подпись Windows-обновлений при выпуске'
        type: boolean
        default: false

permissions:
  contents: read

env:
  QT_VERSION: 6.10.1

jobs:
  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
    steps:
      - id: compute
        env:
          FULL: ${{ inputs.full_matrix == true || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          set -eu
          ALL='[
            {"os":"ubuntu-22.04","arch":"x86_64","package":"appimage"},
            {"os":"windows-2022","arch":"x64","package":"winzip"},
            {"os":"macos-latest","arch":"universal","cmake_arch":"x86_64;arm64","package":"macapp"}
          ]'
          if [ "$FULL" = "true" ]; then
            M=$(echo "$ALL" | jq -c '{include: .}')
          else
            M=$(echo "$ALL" | jq -c '{include: [.[] | select(.os | startswith("ubuntu"))]}')
          fi
          echo "matrix=$M" >> "$GITHUB_OUTPUT"

  build:
    needs: set-matrix
    name: TSSLogViewer / ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          install-deps: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # Сначала обновляем индексы: версии из образа runner могут исчезнуть с зеркала.
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            ninja-build \
            libgl1-mesa-dev libglu1-mesa-dev \
            libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb1 libxcb-cursor0 libxcb-glx0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render0 libxcb-render-util0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
            libegl1 libopengl0 libfuse2 libssl-dev zsync

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"

      - name: Install DMG packaging tools
        if: runner.os == 'macOS'
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild-venv"
          "$RUNNER_TEMP/dmgbuild-venv/bin/python" -m pip install -r packaging/macos/requirements-dmg.txt

      - name: Prepare platform update configuration
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          CHANNEL=viewer
          if [ "$RUNNER_OS" = "macOS" ]; then CHANNEL=viewer-community; fi
          echo "TSS_UPDATE_BUILD=$(date +%s)" >> "$GITHUB_ENV"
          echo "TSS_UPDATE_CHANNEL=$CHANNEL" >> "$GITHUB_ENV"

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTSS_UPDATE_BUILD=$TSS_UPDATE_BUILD -DTSS_UPDATE_CHANNEL=$TSS_UPDATE_CHANNEL

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTSS_UPDATE_BUILD=$TSS_UPDATE_BUILD -DTSS_UPDATE_CHANNEL=$TSS_UPDATE_CHANNEL
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          "-DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_arch }}"

      - name: Build
        run: cmake --build build --parallel

      - name: Test Windows updater and recovery
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $keys = Join-Path $env:RUNNER_TEMP 'updater-test-keys'
          & ./updater/tools/New-UpdateKey.ps1 -PrivateKeyPath "$keys/test-private.pem" -PublicKeyPath "$keys/test-public.txt"
          cmake -S updater -B build-updater-tests -G Ninja -DCMAKE_BUILD_TYPE=Release -DTSS_UPDATER_BUILD_CLIENT=OFF -DTSS_UPDATER_BUILD_TESTS=ON "-DTSS_UPDATE_PUBLIC_KEY=$keys/test-public.txt"
          if ($LASTEXITCODE) { throw 'Updater test configure failed' }
          cmake --build build-updater-tests
          if ($LASTEXITCODE) { throw 'Updater test build failed' }
          ctest --test-dir build-updater-tests --output-on-failure
          if ($LASTEXITCODE) { throw 'Updater protocol tests failed' }
          $fixture = Join-Path $env:ProgramFiles "TSSUpdaterTests-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & ./updater/tests/integration.ps1 -Updater build-updater-tests/TSSUpdater.exe -CoreTests build-updater-tests/tss_update_tests.exe -PrivateKey "$keys/test-private.pem" -PublicKey "$keys/test-public.txt" -Workspace $fixture

      - name: Test signed AppImage updates
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          cmake -S updater/tests/platform -B build-platform-tests -G Ninja -DCMAKE_BUILD_TYPE=Release
          python3 updater/tests/platform/fixtures.py build-platform-tests/fixtures
          cmake --build build-platform-tests --parallel
          ctest --test-dir build-platform-tests --output-on-failure

      - name: Read version
        id: version
        shell: bash
        run: |
          set -eu
          VERSION=$(cat build/VERSION.txt)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "Invalid application version: $VERSION" >&2
            exit 1
          fi
          STEM="TSSLogViewer-v${VERSION}"
          case "${{ matrix.package }}" in
            appimage) ART="${STEM}-linux-${{ matrix.arch }}.AppImage" ;;
            macapp) ART="${STEM}-macos-${{ matrix.arch }}.dmg" ;;
            winzip) ART="${STEM}-windows-${{ matrix.arch }}.zip" ;;
          esac
          echo "stem=$STEM" >> "$GITHUB_OUTPUT"
          echo "artifact=$ART" >> "$GITHUB_OUTPUT"
          # Sparkle получает отдельный ZIP из той же подписанной программы.
          UPDATE_ART="$ART"
          if [ "${{ matrix.package }}" = "macapp" ]; then UPDATE_ART="${STEM}-macos-${{ matrix.arch }}.app.zip"; fi
          echo "update_artifact=$UPDATE_ART" >> "$GITHUB_OUTPUT"

      - name: Prepare matching sources and licenses
        shell: bash
        run: |
          set -eu
          mkdir -p viewer-package/Source viewer-package/licenses/TSSLogViewer
          git archive --format=zip --output="$GITHUB_WORKSPACE/viewer-package/Source/TSSLogViewer-source.zip" HEAD
          cp LICENSE THIRD_PARTY_NOTICES.md viewer-package/licenses/TSSLogViewer/
          cp -R licenses viewer-package/licenses/TSSLogViewer/
          mkdir -p viewer-package/licenses/TSSUpdater
          cp updater/LICENSE viewer-package/licenses/TSSUpdater/LICENSE

      - name: Package Windows portable ZIP
        if: matrix.package == 'winzip'
        shell: pwsh
        env:
          TSS_UPDATE_PRIVATE_KEY: ${{ secrets.TSS_UPDATE_PRIVATE_KEY }}
          REQUIRE_SIGNATURE: ${{ inputs.require_signed_updates }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = "dist/${{ steps.version.outputs.stem }}"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item -LiteralPath 'build/TSSLogViewer.exe', 'build/VERSION.txt' -Destination $dist
          windeployqt --release --no-translations --dir $dist "$dist/TSSLogViewer.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed: $LASTEXITCODE" }
          # Приложение загружает qtbase_*.qm напрямую, без объединённого qt_*.qm.
          $qtTranslations = qmake -query QT_INSTALL_TRANSLATIONS
          if ($LASTEXITCODE -ne 0) { throw "qmake failed: $LASTEXITCODE" }
          New-Item -ItemType Directory -Path "$dist/translations" -Force | Out-Null
          foreach ($language in @('en', 'ru', 'de', 'zh_TW')) {
            $translation = Join-Path $qtTranslations "qtbase_$language.qm"
            if (Test-Path -LiteralPath $translation) {
              Copy-Item -LiteralPath $translation -Destination "$dist/translations/"
            }
          }
          Copy-Item -Path 'viewer-package/*' -Destination $dist -Recurse
          Copy-Item -LiteralPath build/TSSUpdater.exe -Destination $dist
          $version = (Get-Content -LiteralPath build/VERSION.txt -Raw).Trim()
          & ./updater/tools/New-UpdatePackage.ps1 -SourceDir $dist -OutputDir update-feed `
            -Product tss-viewer-windows-x64 -Version $version -ViewerVersion $version `
            -AllowUnsignedBuild:($env:REQUIRE_SIGNATURE -ne 'true')
          if (Test-Path -LiteralPath update-feed/latest.tssupdate) {
            Compress-Archive -Path 'update-feed/*' -DestinationPath 'TSSLogViewer-windows-update.zip'
          }
          Compress-Archive -Path $dist -DestinationPath "${{ steps.version.outputs.artifact }}" -Force

      - name: Upload signed Windows update feed
        if: matrix.package == 'winzip'
        uses: actions/upload-artifact@v4
        with:
          name: TSSLogViewer-windows-update.zip
          path: TSSLogViewer-windows-update.zip
          if-no-files-found: ignore

      - name: Package Linux AppImage
        if: matrix.package == 'appimage'
        shell: bash
        run: |
          set -eux
          mkdir -p tools
          curl --fail --location --retry 3 -o tools/linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl --fail --location --retry 3 -o tools/linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x tools/linuxdeploy tools/linuxdeploy-plugin-qt
          export APPDIR="$PWD/AppDir"
          DESTDIR="$APPDIR" cmake --install build --prefix /usr
          mkdir -p "$APPDIR/usr/share/TSSLogViewer"
          cp -R viewer-package/. "$APPDIR/usr/share/TSSLogViewer/"
          QT_TRANSLATIONS=$(qmake -query QT_INSTALL_TRANSLATIONS)
          QT_LIBDIR=$(qmake -query QT_INSTALL_LIBS)
          export QMAKE=$(command -v qmake)
          export LD_LIBRARY_PATH="${QT_LIBDIR}:${LD_LIBRARY_PATH:-}"
          ./tools/linuxdeploy --appdir "$APPDIR" -e build/TSSLogViewer --plugin qt
          mkdir -p "$APPDIR/usr/translations"
          for lang in en ru de zh_TW; do
            if [ -f "$QT_TRANSLATIONS/qtbase_${lang}.qm" ]; then
              cp "$QT_TRANSLATIONS/qtbase_${lang}.qm" "$APPDIR/usr/translations/"
            fi
          done
          python3 updater/tools/platform-package.py prepare-linux --appdir "$APPDIR"
          export UPDATE_INFORMATION="zsync|https://tsslimiter.com/updates/linux/$TSS_UPDATE_CHANNEL/latest.AppImage.zsync"
          ./tools/linuxdeploy --appdir "$APPDIR" --output appimage
          mv -v TSSLogViewer*.AppImage "${{ steps.version.outputs.artifact }}"

      - name: Package macOS application
        if: matrix.package == 'macapp'
        shell: bash
        run: |
          set -eux
          APP="build/TSSLogViewer.app"
          macdeployqt "$APP" -always-overwrite
          mkdir -p "$APP/Contents/Resources/licenses/TSSUpdater"
          cp updater/LICENSE "$APP/Contents/Resources/licenses/TSSUpdater/TSSUpdater.txt"
          cp updater/licenses/Sparkle.txt "$APP/Contents/Resources/licenses/TSSUpdater/"
          cp -R viewer-package/. "$APP/Contents/Resources/"
          QT_TRANSLATIONS=$(qmake -query QT_INSTALL_TRANSLATIONS)
          mkdir -p "$APP/Contents/Resources/translations"
          for lang in en ru de zh_TW; do
            if [ -f "$QT_TRANSLATIONS/qtbase_${lang}.qm" ]; then
              cp "$QT_TRANSLATIONS/qtbase_${lang}.qm" "$APP/Contents/Resources/translations/"
            fi
          done
          # Публичный CI не требует сертификатов: только локальная ad-hoc подпись, без нотарификации.
          python3 updater/tools/sign-macos.py "$APP"
          codesign --verify --deep --strict "$APP"
          ditto -c -k --keepParent "$APP" "${{ steps.version.outputs.update_artifact }}"
          "$RUNNER_TEMP/dmgbuild-venv/bin/python" packaging/macos/create-dmg.py \
            --app "$APP" --output "${{ steps.version.outputs.artifact }}"
          echo 'macOS artifact has an ad-hoc signature only; it is not Developer ID signed or notarized.' >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare signed platform update feed
        if: runner.os != 'Windows'
        shell: bash
        env:
          TSS_UPDATE_PRIVATE_KEY: ${{ secrets.TSS_UPDATE_PRIVATE_KEY }}
          TSS_SPARKLE_PRIVATE_KEY: ${{ secrets.TSS_SPARKLE_PRIVATE_KEY }}
          REQUIRE_SIGNATURE: ${{ inputs.require_signed_updates }}
        run: |
          set -eu
          PLATFORM=linux
          if [ "$RUNNER_OS" = "macOS" ]; then PLATFORM=macos; fi
          set --
          if [ "$REQUIRE_SIGNATURE" = "true" ]; then set -- --require-signature; fi
          python3 updater/tools/platform-package.py "$PLATFORM" \
            --artifact "${{ steps.version.outputs.update_artifact }}" --app "TSSLogViewer" \
            --version "$(cat build/VERSION.txt)" --build "$(cat build/UPDATE_BUILD.txt)" \
            --channel "$TSS_UPDATE_CHANNEL" --sparkle "build/sparkle" \
            --output "TSSLogViewer-$PLATFORM-update" "$@"

      - name: Upload signed platform update feed
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: TSSLogViewer-${{ runner.os }}-update
          path: TSSLogViewer-*-update.zip
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: ${{ steps.version.outputs.artifact }}
          retention-days: 14
          if-no-files-found: error
